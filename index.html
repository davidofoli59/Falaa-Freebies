                      <span>›</span>
                    </button>
                    <button onClick={() => { setAuthMode('signup'); setAuthModalOpen(true); }} className="w-full p-3.5 rounded-xl bg-white/80 border border-[#7e5b31]/15 flex items-center justify-between text-xs font-bold text-[#4d382c]">
                      <span>✨ Create Account (Sign Up)</span>
                      <span>›</span>
                    </button>
                    <button onClick={() => setShareModalOpen(true)} className="w-full p-3.5 rounded-xl bg-white/80 border border-[#7e5b31]/15 flex items-center justify-between text-xs font-bold text-[#4d382c]">
                      <span>📤 Share the App & Help Others</span>
                      <span>›</span>
                    </button>
                  </div>
                </div>

              </motion.div>
            )}
          </AnimatePresence>
        </main>

        {/* Bottom Navigation */}
        <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md h-18 bg-[#fbf4e6]/95 backdrop-blur-xl border-t border-[#7e5b31]/15 grid grid-cols-5 px-1 pb-safe z-30 shadow-2xl items-center">
          {[
            { id: 'home', label: 'Home', icon: '⌂' },
            { id: 'community', label: 'Community', icon: '👥' },
            { id: 'explore', label: 'Explore', icon: '◎' },
            { id: 'post', label: 'Post', icon: '+' },
            { id: 'profile', label: 'Profile', icon: '👤' }
          ].map(tab => (
            <motion.button
              key={tab.id}
              whileTap={{ scale: 0.9 }}
              onClick={() => {
                if (tab.id === 'post') {
                  setPostModalOpen(true);
                } else {
                  setCurrentTab(tab.id);
                }
              }}
              className={`flex flex-col items-center justify-center rounded-2xl py-1 transition-all ${currentTab === tab.id ? 'text-[#a97622] font-bold' : 'text-[#8d7564] font-medium'}`}
            >
              {tab.id === 'post' ? (
                <div className="w-11 h-11 rounded-full bg-gradient-to-tr from-[#dfbd6b] to-[#b58125] text-white text-2xl font-bold flex items-center justify-center shadow-lg -mt-3 border-2 border-[#fbf3e7]">
                  +
                </div>
              ) : (
                <>
                  <span className="text-xl leading-none mb-1">{tab.icon}</span>
                  <span className="text-[9px]">{tab.label}</span>
                </>
              )}
            </motion.button>
          ))}
        </nav>

        {/* Country Selection Modal */}
        <AnimatePresence>
          {activeModalContinent && (
            <motion.div 
              initial={{ opacity: 0 }}
              animate={{ opacity: 1 }}
              exit={{ opacity: 0 }}
              onClick={() => setActiveModalContinent(null)}
              className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-end justify-center">
              <motion.div 
                initial={{ y: '100%' }}
                animate={{ y: 0 }}
                exit={{ y: '100%' }}
                transition={{ type: 'spring', damping: 25, stiffness: 250 }}
                onClick={e => e.stopPropagation()}
                className="w-full max-w-md max-h-[82vh] bg-[#fbf4e8] rounded-t-3xl p-6 flex flex-col shadow-2xl overflow-hidden">
                
                <div className="flex items-center justify-between mb-4">
                  <button onClick={() => setActiveModalContinent(null)} className="w-8 h-8 rounded-full bg-white/80 border flex items-center justify-center font-bold text-[#4d382c]">‹</button>
                  <div className="text-center">
                    <span className="text-[10px] text-[#8d7564] uppercase font-bold tracking-wider">{activeModalContinent.icon} {activeModalContinent.name}</span>
                    <h3 className="font-serif text-2xl font-bold text-[#4d382c]">{activeModalContinent.name}</h3>
                  </div>
                  <div className="w-8"></div>
                </div>

                <div className="relative mb-3">
                  <span className="absolute left-3 top-3 text-[#8d7564]">⌕</span>
                  <input 
                    type="text" 
                    placeholder="Search country..."
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    className="w-full py-2.5 pl-9 pr-9 rounded-xl bg-white/80 border border-[#7e5b31]/15 text-xs text-[#4d382c] outline-none"
                  />
                  {searchQuery && <button onClick={() => setSearchQuery('')} className="absolute right-3 top-3 text-xs text-[#8d7564]">×</button>}
                </div>

                <div className="flex-1 overflow-y-auto space-y-2 pr-1">
                  {activeModalContinent.countries
                    .filter(c => c.toLowerCase().includes(searchQuery.toLowerCase()))
                    .map(country => (
                      <motion.button
                        key={country}
                        whileTap={{ scale: 0.98 }}
                        onClick={() => setSelectedCountry(country)}
                        className={`w-full p-3.5 rounded-2xl flex items-center justify-between text-xs font-bold transition-all ${selectedCountry === country ? 'bg-gradient-to-r from-[#f8edda] to-[#ecd9b8] border-2 border-[#cda14c] shadow-md' : 'bg-white/60 text-[#4d382c] border border-[#7e5b31]/10'}`}
                      >
                        <div className="flex items-center gap-3">
                          <span className="text-base">🏳️</span>
                          <span>{country}</span>
                        </div>
                        {selectedCountry === country && <span className="w-5 h-5 rounded-full bg-[#cda14c] text-white flex items-center justify-center text-[10px]">✓</span>}
                      </motion.button>
                  ))}
                </div>

                <div className="mt-4 pt-3 border-t border-[#7e5b31]/10">
                  <button 
                    onClick={() => {
                      showToast(`Location set to ${selectedCountry}`);
                      setActiveModalContinent(null);
                    }}
                    className="w-full py-3.5 rounded-xl bg-gradient-to-r from-[#dfbd6b] to-[#b58125] text-white font-bold text-xs shadow-lg flex items-center justify-center gap-2">
                    <span>Confirm Location</span>
                    <span>✓</span>
                  </button>
                  <p className="text-[9px] text-center text-[#8d7564] mt-2">Your selected location helps us personalize your freebies experience.</p>
                </div>
              </motion.div>
            </motion.div>
          )}
        </AnimatePresence>

        {/* Sign In / Sign Up Modal */}
        <AnimatePresence>
          {authModalOpen && (
            <motion.div 
              initial={{ opacity: 0 }}
              animate={{ opacity: 1 }}
              exit={{ opacity: 0 }}
              onClick={() => setAuthModalOpen(false)}
              className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <motion.div 
                initial={{ scale: 0.9, opacity: 0 }}
                animate={{ scale: 1, opacity: 1 }}
                exit={{ scale: 0.9, opacity: 0 }}
                onClick={e => e.stopPropagation()}
                className="w-full max-w-sm bg-[#fbf4e8] rounded-3xl p-6 shadow-2xl border border-[#b98b34]/40">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="font-serif text-xl font-bold text-[#4d382c]">
                    {authMode === 'login' ? '🔐 Sign In' : '✨ Create Account'}
                  </h3>
                  <button onClick={() => setAuthModalOpen(false)} className="w-8 h-8 rounded-full bg-white/80 border text-base font-bold">×</button>
                </div>
                
                <div className="space-y-3 mb-4">
                  <div>
                    <label className="text-[10px] font-bold text-[#8d7564] uppercase">Email Address</label>
                    <input type="email" placeholder="you@example.com" className="w-full mt-1 p-3 rounded-xl bg-white/80 border border-[#7e5b31]/20 text-xs outline-none" />
                  </div>
                  <div>
                    <label className="text-[10px] font-bold text-[#8d7564] uppercase">Password</label>
                    <input type="password" placeholder="••••••••" className="w-full mt-1 p-3 rounded-xl bg-white/80 border border-[#7e5b31]/20 text-xs outline-none" />
                  </div>
                </div>

                <div className="p-3 rounded-xl bg-[#dfbd6b]/15 border border-[#dfbd6b]/30 mb-4">
                  <p className="text-[10px] text-[#7c6451] leading-relaxed">
                    💡 <strong>Note:</strong> Full authentication server will be available when production is ready and won't take long.
                  </p>
                </div>

                <button 
                  onClick={() => {
                    showToast(authMode === 'login' ? 'Successfully signed in!' : 'Account created successfully!');
                    setAuthModalOpen(false);
                  }}
                  className="w-full py-3 rounded-xl bg-gradient-to-r from-[#dfbd6b] to-[#b58125] text-white font-bold text-xs shadow-md">
                  {authMode === 'login' ? 'Sign In' : 'Sign Up Now'}
                </button>

                <div className="text-center mt-3">
                  <button 
                    onClick={() => setAuthMode(authMode === 'login' ? 'signup' : 'login')}
                    className="text-[10px] text-[#b58125] font-bold hover:underline">
                    {authMode === 'login' ? "Don't have an account? Sign up" : "Already have an account? Sign in"}
                  </button>
                </div>
              </motion.div>
            </motion.div>
          )}
        </AnimatePresence>

        {/* Share App & Help Modal */}
        <AnimatePresence>
          {shareModalOpen && (
            <motion.div 
              initial={{ opacity: 0 }}
              animate={{ opacity: 1 }}
              exit={{ opacity: 0 }}
              onClick={() => setShareModalOpen(false)}
              className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <motion.div 
                initial={{ scale: 0.9, opacity: 0 }}
                animate={{ scale: 1, opacity: 1 }}
                exit={{ scale: 0.9, opacity: 0 }}
                onClick={e => e.stopPropagation()}
                className="w-full max-w-sm bg-[#fbf4e8] rounded-3xl p-6 shadow-2xl border border-[#b98b34]/40 text-center">
                <div className="w-14 h-14 mx-auto rounded-full bg-gradient-to-tr from-[#dfbd6b] to-[#b58125] text-white text-2xl flex items-center justify-center shadow-md mb-3">
                  📤
                </div>
                <h3 className="font-serif text-xl font-bold text-[#4d382c]">Share the App & Help Others</h3>
                <p className="text-xs text-[#8d7564] mt-1 mb-4 leading-relaxed">
                  Help whom will be interested and in need by sharing Falaa Freebies with friends, family, and local communities.
                </p>
                <div className="space-y-2 mb-5">
                  <button onClick={() => showToast('App link copied to clipboard!')} className="w-full p-3 rounded-xl bg-white/80 border text-xs font-bold text-[#4d382c]">
                    📋 Copy App Link
                  </button>
                  <button onClick={() => showToast('Shared to WhatsApp successfully!')} className="w-full p-3 rounded-xl bg-[#25d366]/20 text-[#128c7e] border border-[#25d366]/30 text-xs font-bold">
                    💚 Share via WhatsApp
                  </button>
                </div>
                <button onClick={() => setShareModalOpen(false)} className="w-full py-2.5 rounded-xl bg-[#b58125] text-white font-bold text-xs">
                  Close
                </button>
              </motion.div>
            </motion.div>
          )}
        </AnimatePresence>

        {/* Post Freebie / Help Modal */}
        <AnimatePresence>
          {postModalOpen && (
            <motion.div 
              initial={{ opacity: 0 }}
              animate={{ opacity: 1 }}
              exit={{ opacity: 0 }}
              onClick={() => setPostModalOpen(false)}
              className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <motion.div 
                initial={{ scale: 0.9, opacity: 0 }}
                animate={{ scale: 1, opacity: 1 }}
                exit={{ scale: 0.9, opacity: 0 }}
                onClick={e => e.stopPropagation()}
                className="w-full max-w-sm bg-[#fbf4e8] rounded-3xl p-6 shadow-2xl border border-[#b98b34]/40">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="font-serif text-xl font-bold text-[#4d382c]">🎁 Post a Freebie or Help</h3>
                  <button onClick={() => setPostModalOpen(false)} className="w-8 h-8 rounded-full bg-white/80 border text-base font-bold">×</button>
                </div>
                <div className="space-y-3 mb-4">
                  <div>
                    <label className="text-[10px] font-bold text-[#8d7564] uppercase">Title / Item Name</label>
                    <input type="text" placeholder="e.g. Gently used winter jacket" className="w-full mt-1 p-3 rounded-xl bg-white/80 border text-xs outline-none" />
                  </div>
                  <div>
                    <label className="text-[10px] font-bold text-[#8d7564] uppercase">Description</label>
                    <textarea rows="3" placeholder="Describe the item or help needed..." className="w-full mt-1 p-3 rounded-xl bg-white/80 border text-xs outline-none resize-none"></textarea>
                  </div>
                </div>
                <button onClick={() => { showToast('Posted successfully to community feed!'); setPostModalOpen(false); }} className="w-full py-3 rounded-xl bg-gradient-to-r from-[#dfbd6b] to-[#b58125] text-white font-bold text-xs shadow-md">
                  Publish Post
                </button>
              </motion.div>
            </motion.div>
          )}
        </AnimatePresence>

        {/* Toast Notification */}
        <AnimatePresence>
          {toastMessage && (
            <motion.div 
              initial={{ opacity: 0, y: 20, x: '-50%' }}
              animate={{ opacity: 1, y: 0, x: '-50%' }}
              exit={{ opacity: 0, y: 10, x: '-50%' }}
              className="fixed bottom-24 left-1/2 z-50 px-4 py-2.5 rounded-2xl bg-[#3f2c20] text-[#fbf3e7] text-xs font-bold shadow-2xl border border-[#b98b34]/40 flex items-center gap-2">
              <span>✦</span>
              <span>{toastMessage}</span>
            </motion.div>
          )}
        </AnimatePresence>

      </div>
    );
  }

  ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
